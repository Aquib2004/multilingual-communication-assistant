# Alembic configuration.
# The database URL is intentionally NOT set here. It is read from the
# environment at runtime in alembic/env.py, so credentials never live in a
# committed file.

[alembic]
script_location = alembic
prepend_sys_path = .
# The URL is supplied by alembic/env.py from the DATABASE_URL environment
# variable, so no credential is ever committed to this file.
sqlalchemy.url =

# Intentionally no post-write hooks. Formatting is enforced by `make format`
# and by the format-check job in CI, which keeps `alembic revision` working on
# a machine that has not installed the optional dev tooling.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
