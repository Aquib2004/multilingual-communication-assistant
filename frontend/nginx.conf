# nginx configuration for the production frontend image.
#
# Two things matter here:
# 1. Client-side routes such as /workspace must fall back to index.html,
#    otherwise a browser refresh on a deep link returns 404.
# 2. /api is proxied to the backend so the browser only ever talks to one
#    origin, which means no CORS preflight in production.

upstream backend_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact server version.
    server_tokens off;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Translations of long messages can take a while on the mock provider.
        proxy_read_timeout 120s;
    }

    # Hashed build assets never change, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}