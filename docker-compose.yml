# Multilingual Communication Assistant - local development stack.
# Usage:  cp .env.example .env  &&  docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: mca-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multilingual_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multilingual_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mca-migrate
    # Applies `alembic upgrade head` once, then exits. The API depends on this
    # completing so the schema is guaranteed to exist before traffic arrives.
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/multilingual_assistant
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      # Context is the repository root because the image also ships ./examples.
      context: .
      dockerfile: backend/Dockerfile
    container_name: mca-backend
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      LOG_MESSAGE_CONTENT: "false"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/multilingual_assistant
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      AI_PROVIDER: mock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8000/api/health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    container_name: mca-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
